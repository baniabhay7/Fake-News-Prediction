<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake news detector</title>
    <style>
        :root {
            --fg: #111;
            --fg-2: #555;
            --fg-3: #888;
            --bg: #fff;
            --line: #e6e6e6;
            --line-strong: #111;
            --accent-fake: #b00020;
            --accent-real: #0a6c3d;
            --warn-bg: #fff8e6;
            --warn-fg: #6b4a00;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        a { color: var(--fg); }
        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 96px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--line);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }
        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0;
        }
        header .meta {
            font-size: 13px;
            color: var(--fg-3);
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-real);
            margin-right: 6px;
            transform: translateY(-1px);
        }
        .status-dot.off { background: var(--accent-fake); }

        .samples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .samples span {
            font-size: 13px;
            color: var(--fg-3);
            margin-right: 4px;
        }
        .sample-btn {
            font: inherit;
            font-size: 13px;
            background: none;
            border: 1px solid var(--line);
            color: var(--fg-2);
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
        }
        .sample-btn:hover { border-color: var(--line-strong); color: var(--fg); }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 14px;
            font: inherit;
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 4px;
            resize: vertical;
            background: var(--bg);
        }
        textarea:focus {
            outline: none;
            border-color: var(--line-strong);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--fg-3);
        }
        button.primary {
            font: inherit;
            background: var(--fg);
            color: var(--bg);
            border: none;
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 4px;
        }
        button.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            margin-top: 40px;
        }
        .verdict {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }
        .verdict .label {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .verdict.fake .label { color: var(--accent-fake); }
        .verdict.real .label { color: var(--accent-real); }
        .verdict .conf {
            font-size: 14px;
            color: var(--fg-3);
        }

        .section {
            margin-top: 24px;
        }
        .section h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--fg-3);
            font-weight: 600;
            margin: 0 0 10px;
        }

        table.models {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.models td {
            padding: 6px 0;
            border-bottom: 1px solid var(--line);
        }
        table.models td:first-child { color: var(--fg-2); }
        table.models td:nth-child(2) {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--fg-3);
            padding-right: 14px;
        }
        table.models td:last-child {
            text-align: right;
            font-weight: 500;
            width: 80px;
        }
        td.fake { color: var(--accent-fake); }
        td.real { color: var(--accent-real); }

        .factcheck {
            font-size: 14px;
        }
        .warning {
            background: var(--warn-bg);
            color: var(--warn-fg);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .ents {
            color: var(--fg-2);
            margin-top: 8px;
        }
        .ents .group { margin-bottom: 4px; }
        .ents .group strong {
            color: var(--fg-3);
            font-weight: 500;
            margin-right: 6px;
        }
        .ents code {
            font-size: 13px;
            background: #f4f4f4;
            padding: 1px 6px;
            border-radius: 3px;
            margin-right: 4px;
        }
        .verify {
            margin-top: 6px;
            color: var(--fg-2);
            font-size: 13px;
        }
        .verify .ok { color: var(--accent-real); }
        .verify .miss { color: var(--accent-fake); }

        .empty { color: var(--fg-3); font-style: italic; font-size: 13px; }

        .error {
            color: var(--accent-fake);
            padding: 12px;
            border: 1px solid var(--accent-fake);
            border-radius: 4px;
            font-size: 14px;
        }

        footer {
            margin-top: 64px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--fg-3);
            display: flex;
            justify-content: space-between;
        }

        .hide { display: none; }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <h1>Fake news detector</h1>
        <div class="meta">
            <span class="status-dot {% if not model_loaded %}off{% endif %}"></span>
            {% if model_loaded %}{{ available_models|length }} models loaded{% else %}models not loaded{% endif %}
        </div>
    </header>

    <form id="newsForm">
        <div class="samples">
            <span>Try:</span>
            {% for key, item in sample_news.items() %}
            <button type="button" class="sample-btn" data-sample="{{ key }}">{{ item.title[:42] }}{% if item.title|length > 42 %}…{% endif %}</button>
            {% endfor %}
        </div>

        <textarea id="newsText" placeholder="Paste a news article here." maxlength="5000" required></textarea>

        <div class="row">
            <span><span id="charCount">0</span> / 5000</span>
            <button type="submit" class="primary" id="analyzeBtn">Analyse</button>
        </div>
    </form>

    <div id="result" class="hide"></div>

    <footer>
        <span>Ensemble of 4 classifiers · TF-IDF + spaCy fact check</span>
        <a href="/about">About</a>
    </footer>
</div>

<script>
const sampleNews = {{ sample_news | tojson }};

const $ = (id) => document.getElementById(id);
const textarea = $('newsText');
const charCount = $('charCount');
const result = $('result');
const analyzeBtn = $('analyzeBtn');

textarea.addEventListener('input', () => {
    charCount.textContent = textarea.value.length;
});

document.querySelectorAll('.sample-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const key = btn.dataset.sample;
        textarea.value = sampleNews[key].text;
        charCount.textContent = textarea.value.length;
        textarea.focus();
    });
});

$('newsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textarea.value.trim();
    if (!text) return;

    analyzeBtn.disabled = true;
    analyzeBtn.textContent = 'Analysing…';
    result.classList.remove('hide');
    result.innerHTML = '<p class="empty">Running ensemble…</p>';

    try {
        const res = await fetch('/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text})
        });
        const data = await res.json();
        if (!data.success) {
            result.innerHTML = `<div class="error">${escapeHtml(data.error || 'Unknown error')}</div>`;
        } else {
            renderResult(data);
        }
    } catch (err) {
        result.innerHTML = `<div class="error">Request failed: ${escapeHtml(err.message)}</div>`;
    } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyse';
    }
});

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderResult(data) {
    const isFake = data.prediction.includes('FAKE');
    const verdictClass = isFake ? 'fake' : 'real';
    const label = isFake ? 'Fake' : 'Real';

    let html = `
        <div class="verdict ${verdictClass}">
            <span class="label">${label}</span>
            <span class="conf">${data.confidence.toFixed(1)}% confidence · ${data.fake_votes} fake / ${data.real_votes} real votes</span>
        </div>

        <div class="section">
            <h2>Per-model</h2>
            <table class="models">
                ${Object.entries(data.individual_results).map(([name, m]) => {
                    const f = m.prediction.includes('FAKE');
                    return `
                        <tr>
                            <td>${escapeHtml(name)}</td>
                            <td>R ${m.real_probability.toFixed(1)}% · F ${m.fake_probability.toFixed(1)}%</td>
                            <td class="${f ? 'fake' : 'real'}">${f ? 'Fake' : 'Real'}</td>
                        </tr>
                    `;
                }).join('')}
            </table>
        </div>

        ${renderFactCheck(data.fact_check)}
    `;

    result.innerHTML = html;
    result.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function renderFactCheck(fc) {
    if (!fc) {
        return `
            <div class="section">
                <h2>spaCy fact check</h2>
                <p class="empty">Fact checker unavailable. Install spaCy + en_core_web_sm to enable.</p>
            </div>
        `;
    }

    const warnings = (fc.warnings || []).map(w =>
        `<div class="warning">${escapeHtml(w)}</div>`
    ).join('');

    const entityGroups = Object.entries(fc.entities || {})
        .filter(([_, items]) => items && items.length)
        .map(([k, items]) => `
            <div class="group">
                <strong>${escapeHtml(k)}:</strong>
                ${items.slice(0, 8).map(e => `<code>${escapeHtml(e)}</code>`).join('')}
            </div>
        `).join('');

    const verification = (fc.verification || []).map(v => {
        const [ok, msg] = v;
        return `<div class="verify"><span class="${ok ? 'ok' : 'miss'}">${ok ? '✓' : '✗'}</span> ${escapeHtml(msg)}</div>`;
    }).join('');

    const hasContent = warnings || entityGroups || verification;

    return `
        <div class="section">
            <h2>spaCy fact check</h2>
            ${warnings || ''}
            ${entityGroups ? `<div class="ents">${entityGroups}</div>` : ''}
            ${verification || ''}
            ${!hasContent ? '<p class="empty">No entities or warnings found in this text.</p>' : ''}
        </div>
    `;
}
</script>
</body>
</html>
